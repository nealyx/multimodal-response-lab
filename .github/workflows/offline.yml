name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUTF8: "1"

jobs:
  tests:
    name: Full suite / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies in a fresh environment
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install -r requirements-test.txt
          .venv-ci/bin/python -m pip check
          .venv-ci/bin/python -m pip freeze
      - name: Run the complete offline suite
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/offline:${{ github.workspace }}
          MPLCONFIGDIR: ${{ runner.temp }}/mrl-test-matplotlib
        run: |
          .venv-ci/bin/python -c 'import socket; assert socket._mrl_offline_guard'
          .venv-ci/bin/python -m pytest tests/ -q -p no:cacheprovider

  demo:
    name: Minimal demo / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install only offline dependencies in a fresh environment
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install -r requirements-offline.txt
          .venv-ci/bin/python -m pip check
          .venv-ci/bin/python -m pip freeze
      - name: Generate and reanalyze the synthetic session
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/offline:${{ github.workspace }}
          MRL_OFFLINE_MINIMAL: "1"
          MPLCONFIGDIR: ${{ runner.temp }}/mrl-demo-matplotlib
        run: |
          .venv-ci/bin/python -c 'import socket; assert socket._mrl_offline_guard'
          .venv-ci/bin/python demo_offline.py --output-dir outputs/ci-demo
          .venv-ci/bin/python analyze_session.py outputs/ci-demo/session --output-dir outputs/ci-reanalysis
          .venv-ci/bin/python embed_session.py outputs/ci-demo/session --output-dir outputs/ci-embeddings
          .venv-ci/bin/python .github/offline/check_outputs.py
