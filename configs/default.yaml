# configs/default.yaml
#
# Central runtime configuration for multimodal-response-lab.
#
# Design principle: every value that a downstream module might want to tweak
# lives here, not hardcoded.  Modules receive a config dict/object; they never
# import this file directly.  This makes unit-testing trivial (pass a dict
# override) and environment-specific overrides possible (prod.yaml, test.yaml).

# ── Device ────────────────────────────────────────────────────────────────────
device:
  # "auto"  → probe CUDA → MPS → CPU in order
  # "cuda"  → require NVIDIA GPU (raises if absent and allow_fallback: false)
  # "mps"   → require Apple Silicon GPU
  # "cpu"   → always use CPU (useful for profiling or CI)
  preferred: auto
  allow_fallback: true   # degrade gracefully instead of crashing on missing HW

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: INFO            # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: "%(asctime)s  %(levelname)-8s  %(name)s — %(message)s"
  datefmt: "%H:%M:%S"

# ── Filesystem paths ──────────────────────────────────────────────────────────
paths:
  data_root: data/
  model_cache: .cache/models/   # HF_HOME is also respected if set in env
  outputs: outputs/

# ── Webcam capture ────────────────────────────────────────────────────────────
capture:
  # device_id: OS camera index.  0 = first camera enumerated by AVFoundation.
  # If macOS Continuity Camera is enabled, the iPhone may claim index 0 and
  # push the built-in FaceTime HD Camera to index 1.  Run any script once to
  # see the candidate list, then set this to the correct index or use --device N.
  device_id: 0

  fps: 30
  resolution: [640, 480]

  # backend: camera backend used by OpenCV.
  # "auto" tries CAP_AVFOUNDATION → CAP_ANY → CAP_QT in order.
  # Set to "avfoundation" to force the macOS native backend; this avoids
  # GStreamer/Qt being picked up when those libraries are present.
  # Override at runtime with --backend NAME without editing this file.
  backend: avfoundation         # prev. auto, changed to avfoundation.  

  flip_horizontal: true    # mirror mode — natural for a selfie-camera view
  # Camera warm-up: discard leading blank frames that AVFoundation emits while
  # the sensor initialises.  Increase warmup_frames if a slow USB camera still
  # shows blank frames on first detection.
  warmup_frames: 30        # max frames to read before declaring the backend dead
  warmup_timeout_s: 6.0   # wall-clock timeout for the warm-up phase
  min_frame_mean: 1.0      # frames with mean pixel value below this are blank

# ── MediaPipe Face Mesh ───────────────────────────────────────────────────────
face_mesh:
  # model_path: path to the downloaded .task bundle.  Auto-downloaded on first
  # run if absent.  Float16 variant ≈ 3 MB; runs on CPU without GPU.
  model_path: .cache/models/face_landmarker.task
  max_faces: 1
  min_detection_confidence: 0.5
  min_presence_confidence:  0.5
  min_tracking_confidence:  0.5

# ── Overlay rendering ─────────────────────────────────────────────────────────
overlay:
  draw_tesselation: true
  draw_contour:     true
  draw_eyes:        true
  draw_lips:        true
  draw_irises:      false   # requires face_mesh.refine_landmarks: true
  show_fps:         true
  show_bbox:        false

# ── Behavioral signal layer ───────────────────────────────────────────────────
signals:
  # EAR normalisation references — population averages.
  # Increase ear_open_ref if EAR rarely reaches 1.0 openness for your camera distance.
  ear_closed_ref: 0.15
  ear_open_ref:   0.35

  blink:
    # Detection thresholds — the gap between close and open creates hysteresis.
    # If you see false positives: raise ear_close_threshold slightly (e.g. 0.22).
    # If real blinks are missed:  lower ear_close_threshold (e.g. 0.18).
    ear_close_threshold:      0.20
    ear_open_threshold:       0.25

    # Debounce: frames that must remain in a state before it is confirmed.
    # At 25 FPS: 2 frames ≈ 80 ms — enough to reject single-frame jitter.
    min_close_frames:         2
    min_open_frames:          2

    # Duration gate (milliseconds).
    # Normal blink: ~80–200 ms.  Slow close: up to 400 ms.
    min_blink_ms:             60.0
    max_blink_ms:             500.0

    # Rolling window and rate thresholds.
    rate_window_s:            60.0
    low_blink_rate_threshold:  8.0   # below → staring / early fatigue
    high_blink_rate_threshold: 25.0  # above → eye strain

    # Drowsiness: single closure longer than this triggers the drowsy flag.
    drowsy_closure_ms:        500.0

    # Suppress rate-based flags until this many seconds of history exist.
    min_history_s:            15.0

# ── Head pose estimation ─────────────────────────────────────────────────────
head_pose:
  # Camera intrinsics approximation: focal_length = focal_scale × frame_width.
  # 1.0 works well for typical 60–90° FOV webcams at 640×480.
  # Tune if you see large systematic yaw/pitch offsets when looking straight ahead.
  focal_scale: 1.0

  # Reprojection error above this (pixels) is logged as a warning.
  # Typical good-quality pose: < 5 px.  > 10 px → landmark noise or far face.
  max_reprojection_error: 10.0

  # Attention zone thresholds (degrees).
  attention:
    yaw_focus_deg:    20.0   # |yaw|  ≤ this → inside focus zone
    pitch_focus_deg:  15.0   # |pitch| ≤ this → inside focus zone
    yaw_glance_deg:   35.0   # |yaw|  ≤ this → glance zone (beyond focus)
    pitch_glance_deg: 25.0   # |pitch| ≤ this → glance zone
    stability_window_s: 5.0  # seconds of history for std-dev computation

# ── Gaze estimation ──────────────────────────────────────────────────────────
gaze:
  # Iris horizontal ratio thresholds for CENTER zone.
  # The ratio is (iris_x − left_corner_x) / (right_corner_x − left_corner_x).
  # 0.0 = iris at image-left extreme, 0.5 = centred, 1.0 = image-right extreme.
  # Widen the band (e.g. 0.30–0.70) if you see too many false LEFT/RIGHT alerts.
  center_h_lo: 0.35
  center_h_hi: 0.65

  # Iris vertical ratio thresholds for CENTER zone.
  # 0.0 = looking up (iris near top lid), 1.0 = looking down (iris near bottom lid).
  # Slightly asymmetric: looking down is normal during screen use.
  center_v_lo: 0.25
  center_v_hi: 0.70

  # Minimum EAR for iris measurement to be considered reliable.
  # Below this, the eyelid is occluding the iris.
  ear_reliable_min: 0.15

  # Head pose gates for is_on_screen: even if iris is centred, the head being
  # turned beyond these angles marks the frame as off-screen.
  head_yaw_max_on_screen:   25.0   # degrees
  head_pitch_max_on_screen: 20.0   # degrees

  # Rolling window for stability std-dev and on_screen_fraction computation.
  stability_window_s: 5.0

# ── Composite engagement scoring ─────────────────────────────────────────────
engagement:
  # Component weights — must sum to 1.0.
  # Gaze is the primary signal; eye alertness outweighs head because head pose
  # is already partially captured by the gaze on-screen gate.
  weights:
    gaze: 0.50
    head: 0.20
    eye:  0.30

  # Score thresholds for state classification.
  thresholds:
    focused:        0.72   # score ≥ this → FOCUSED
    drifting:       0.45   # score ≥ this → DRIFTING (else DISTRACTED)
    min_confidence: 0.20   # below this → UNRELIABLE regardless of score

  # Temporal smoothing — EMA and state debounce.
  # alpha=0.10 at 25 FPS gives a ~0.4 s half-life (absorbs blink transients).
  # state_min_frames=5 prevents state-badge flicker on single-frame anomalies.
  smoothing:
    alpha:            0.10
    state_min_frames: 5

  # Confidence score parameters.
  # min_history_s: seconds of face presence before confidence reaches 1.0.
  # pose_error_max: reprojection error (px) that fully penalises confidence.
  confidence:
    min_history_s:  10.0
    pose_error_max: 10.0

  # Rolling window for focused_fraction / engaged_fraction computation.
  rolling_window_s: 60.0

# ── Model defaults ────────────────────────────────────────────────────────────
model:
  batch_size: 1
  fp16: false              # half-precision on CUDA; has no effect on MPS/CPU
  compile: false           # torch.compile — speeds up CUDA, breaks MPS (2.x)
